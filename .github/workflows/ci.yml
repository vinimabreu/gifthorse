name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No bytecode caches in the checkout: a __pycache__ folder is a REVIEW by
# design, and the self-scan below must see the repository as committed.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      # tests/test_demo.py runs the demo and compares it with the block pasted in
      # the README, so a stale README fails here.
      - name: Pytest
        run: pytest

      - name: Offline demo
        run: python examples/demo.py

      # Self-test, part one: the installed command on this repository. The repo
      # is full of the tokens the rules look for, in prose, tests and docs, so a
      # clean result here is what proves the rules are scoped correctly. With
      # --fail-on review, any finding above info exits 1 and fails the build.
      - name: gifthorse scans its own repository
        run: gifthorse --fail-on review .

      # Self-test, part two: the installed command on a synthetic dropper it must
      # flag, asserting exit 1 and the rule id. Part one alone would pass for a
      # tool that finds nothing. Linux only, since a file carrying a script shape
      # can be quarantined by endpoint protection on other runners.
      - name: gifthorse flags a known-bad package
        if: runner.os == 'Linux'
        run: |
          set +e
          python -c "import pathlib, examples.demo as d; pathlib.Path('brief.zip').write_bytes(d.sample_zip())"
          out="$(gifthorse brief.zip)"
          code=$?
          set -e
          printf '%s\n' "$out"
          test "$code" -eq 1
          grep -q "GH201" <<<"$out"
          grep -q "GH101" <<<"$out"
